name: Cloud Security Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  security-gate:
    name: CSPM Security Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::010603499647:role/Project2-GitHubActionsRole
          aws-region: eu-north-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Prowler
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt

      - name: Run Prowler multi-service assessment
        run: |
          prowler aws --services iam s3 awslambda eventbridge -f eu-north-1 || test $? -eq 3
          CSV_FILE="$(find output -maxdepth 1 -type f -name '*.csv' | sort | tail -n 1)"
          test -n "$CSV_FILE"
          echo "PROWLER_CSV=$CSV_FILE" >> "$GITHUB_ENV"

      - name: Normalize CSPM findings
        run: |
          test -n "$PROWLER_CSV"
          echo "Normalizing: $PROWLER_CSV"
          python3 scripts/normalize_findings.py "$PROWLER_CSV"

      - name: Collect security context
        run: |
          python3 scripts/collect_security_context.py

      - name: Evaluate CSPM risk
        run: |
          python3 scripts/risk_engine.py

      - name: Enforce CSPM security gate
        run: |
          python3 scripts/security_gate.py

      - name: Upload CSPM evidence package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cspm-security-evidence
          path: |
            output/
            reports/security-context.json
            reports/risk-decisions.json
            reports/risk-decision-report.md
            reports/security-gate-report.md
          if-no-files-found: error
